name: Deploy staging preview

on:
  push:
    branches-ignore: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - run: npm install
    - run: npm test

    - name: Build staging variant
      env:
        VITE_GAS_ENDPOINT: ${{ secrets.STAGING_GAS_ENDPOINT }}
        VITE_ALARM_COMMANDS: ${{ secrets.ALARM_COMMANDS }}
        VITE_STAGING: "1"
      run: npm run build:staging

    - name: Deploy staging preview to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist-staging
        destination_dir: staging
        keep_files: true
